<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      color: white;
      text-shadow: 1px 1px 2px black;
    }
    input, button {
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Weather App</h1>

    <input id="city-input" type="text" placeholder="Enter a city">
    <button id="search-btn">Search</button>

    <div id="weather-output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
